<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>虚拟主播 · 桃梓Azusa频道</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.7;
      overflow-wrap: anywhere;
      background-color: #f0f0f3;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #ffafbd, #ffc3a0);
      padding: 48px 20px;
      text-align: center;
      color: #5c2940;
    }

    header h1 {
      font-size: clamp(1.65rem, 5vw, 2.5rem);
      line-height: 1.35;
      margin: 0;
    }

    header p {
      margin: 12px auto 0;
      max-width: 36em;
      font-size: clamp(1rem, 3vw, 1.2rem);
    }

    section {
      width: calc(100% - 32px);
      max-width: 900px;
      margin: 0 auto;
    }

    .avatar {
      text-align: center;
      padding: 32px 0;
    }

    .avatar img {
      display: block;
      width: clamp(120px, 32vw, 180px);
      max-width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
      margin: 0 auto;
      border-radius: 50%;
      border: 4px solid #ffafbd;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .about, .stream, .chat, .fans {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 28px;
    }

    h2 {
      margin: 0 0 16px;
      line-height: 1.4;
      color: #b83257;
    }

    section p {
      margin: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
      background: #f0f0f3;
    }

    .stream-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      color: #a52b4e;
      text-underline-offset: 4px;
    }

    .stream-link:focus-visible {
      outline: 3px solid #a52b4e;
      outline-offset: 4px;
      border-radius: 4px;
    }

    .chat-box {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 180px;
      background: #fefefe;
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 20px;
      font-style: italic;
      color: #666;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 16px 20px 30px;
      font-size: 0.9em;
      color: #666;
    }

    @media (max-width: 600px) {
      header {
        padding: 32px 16px;
      }

      .about, .stream, .chat, .fans {
        padding: 20px 16px;
        margin-bottom: 20px;
      }

      h2 {
        font-size: 1.25rem;
      }

      .chat-box {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>欢迎来到桃梓Azusa的频道！</h1>
    <p>一个温柔又可爱的虚拟主播，正在和你连结中…</p>
  </header>

  <section class="avatar">
    <img src="avatar.jpg" alt="虚拟主播头像" />
  </section>

  <section class="about">
    <h2>关于桃梓Azusa</h2>
    <p>我是虚拟主播桃梓Azusa。我的梦想是把温暖传给每一个人。欢迎你来到这个小小世界，一起发光发热！</p>
  </section>

  <section class="stream">
    <h2>直播中</h2>
    <!-- Bilibili直播 -->
    <iframe title="桃梓Azusa的 Bilibili 直播" src="https://live.bilibili.com/1702263460?broadcast_type=0&is_room_feed=0&spm_id_from=333.1387.to_liveroom.0.click&live_from=86002" allowfullscreen></iframe>
    <a class="stream-link" href="https://live.bilibili.com/1702263460" target="_blank" rel="noopener noreferrer">前往 Bilibili 直播间（新窗口）</a>
  </section>


  <section class="chat">
    <h2>粉丝聊天室</h2>
    <div class="chat-box">
      聊天系统待接入中……
    </div>
  </section>

  <section class="fans">
    <h2>粉丝专区</h2>
    <p>在这里你可以留言、投稿、参与活动，还有机会登上“本月最活跃粉丝榜”！</p>
  </section>

  <footer>
    &copy; 2025 桃梓Azusa频道 | 由你点亮的虚拟世界
  </footer>
</body>
</html>
